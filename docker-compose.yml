services:
  portfolio:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      SITE_URL: ${SITE_URL:?Set the public HTTPS origin}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-api.openai.com,openrouter.ai}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - portfolio-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/id').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  portfolio-data:
